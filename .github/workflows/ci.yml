# CI: every push and pull request must pass lint, types, unit tests and E2E.
# No Gemini key is needed: unit tests mock fetch, E2E tests mock the AI routes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests + coverage; fails if coverage drops below the thresholds in vitest.config.mts.
      - run: npm run coverage

  e2e:
    name: E2E + accessibility (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the app and starts `next start` itself.
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
